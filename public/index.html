<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PhiksNiyar — Skilled People • Real Solutions</title>
  <meta name="theme-color" content="#102F78" />
  <link rel="icon" href="favicon.ico" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #102F78;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      width: 140px;
      height: 140px;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      opacity: 0.85;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #0DB58A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.96); opacity: 0.88; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="phiksniyar-emblem.png" alt="PhiksNiyar" />
  </div>
  <h1>PhiksNiyar</h1>
  <p>Skilled People • Real Solutions</p>
  <div class="spinner"></div>

  <script>
    // Seamless bootstrap for Capacitor Native Shell
    (function() {
      // If configured for remote server, redirect to live server; otherwise stay on local shell
      const targetUrl = window.Capacitor?.getServerUrl ? window.Capacitor.getServerUrl() : null;
      if (targetUrl && targetUrl.startsWith('http') && window.location.href !== targetUrl) {
        window.location.replace(targetUrl);
      }
    })();
  </script>
</body>
</html>
