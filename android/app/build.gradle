apply plugin: 'com.android.application'

android {
    namespace = "com.phiksniyar.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.phiksniyar.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keyPropsFile = rootProject.file("key.properties")
            def keyProps = new Properties()
            if (keyPropsFile.exists()) {
                keyProps.load(new FileInputStream(keyPropsFile))
            }
            def storeFilePath = System.getenv("KEYSTORE_PATH") ?: keyProps.getProperty("storeFile")
            def keystoreFile = storeFilePath ? file(storeFilePath) : null
            def storePass = System.getenv("KEYSTORE_PASSWORD") ?: keyProps.getProperty("storePassword")
            def keyAliasVal = System.getenv("KEY_ALIAS") ?: keyProps.getProperty("keyAlias")
            def keyPass = System.getenv("KEY_PASSWORD") ?: keyProps.getProperty("keyPassword") ?: storePass

            def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
            if (isReleaseTask) {
                if (!storeFilePath || keystoreFile == null || !keystoreFile.exists()) {
                    throw new GradleException("Release build failed: Release keystore file not found at '${storeFilePath}'. Please configure KEYSTORE_PATH environment variable or 'storeFile' in android/key.properties. Release builds must never be silently produced unsigned.")
                }
                if (!storePass || !keyAliasVal) {
                    throw new GradleException("Release build failed: Missing release keystore credentials. Please configure KEYSTORE_PASSWORD and KEY_ALIAS environment variables or in android/key.properties. Release builds must never be silently produced unsigned.")
                }
            }

            if (keystoreFile != null && keystoreFile.exists() && storePass != null) {
                storeFile keystoreFile
                storePassword storePass
                keyAlias keyAliasVal
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
